append:
  order: 1
  short:
    en: Append to the prompt
    zh: 增量追加
  summary:
    en: Changes reach the model as added messages, so the prompt prefix and its cache stay intact.
    zh: 改动以追加消息送到模型，提示前缀和建立在它上面的缓存不受影响。
  title:
    en: Append changes and keep the prompt prefix unchanged
    zh: 增量追加，保持提示前缀不变
  problem:
    en: When a hook rewrites the system prompt or changes the tool list mid-session, every later request starts with a different prefix. The prompt cache misses, and the session pays again for context it has already sent.
    zh: 钩子改写 system prompt，或在会话中途增减工具，之后每个请求的前缀都会变化。提示缓存随之失效，已经发过的上下文要重新计费。
  practice:
    - en: Once a session starts, its system prompt stays as the host built it. Prompt edits, rules and tool notes arrive as `<system-reminder>` messages added to the conversation.
      zh: 会话开始后，system prompt 保持宿主构建时的样子；提示词修改、规则和工具说明都以 `<system-reminder>` 消息追加进对话。
    - en: AGENTS.md and CLAUDE.md are delivered under paths relative to the repository root, so a checkout and its worktrees send the same bytes.
      zh: AGENTS.md 和 CLAUDE.md 以相对仓库根的路径送达，主检出和各个 worktree 发出的内容完全相同。
    - en: Plugins set their whole tool list once, in a fixed order, when a session starts. A later change goes out as a diff message.
      zh: 插件在会话开始时按固定顺序一次写定全部工具，之后的变化只以差分消息告知。
  seen: [system-prompt-replace, repo-rules, tool-topics, append-system-model]

signals:
  order: 2
  short:
    en: Correct from signals
    zh: 按信号纠偏
  summary:
    en: Long sessions drift from static instructions. omomp watches what the agent does and responds at the step where drift appears.
    zh: 长会话会逐渐偏离静态指令。omomp 观察代理的实际动作，在偏离出现的那一步处理。
  title:
    en: Correct drift from observable signals
    zh: 用可观测的信号纠正偏离
  problem:
    en: A model given two instructions that disagree follows neither reliably. Over a long session it drifts from the system prompt even when the prompt is clean.
    zh: 两条指令互相冲突时，模型哪条都不会稳定遵守；即使提示词没有冲突，长会话里它也会逐渐偏离。
  practice:
    - en: "First the conflicts go: duplicated tool prose leaves the base template, tool details move into on-demand topics, and host sentences that contradict local rules are overridden by appended replacements."
      zh: 先消除冲突：基础模板删去重复的工具说明，工具细节移进按需读取的专题，与本地规则矛盾的宿主原句用追加的替换声明覆盖。
    - en: Then behavior is checked. A misused tool, two writers in one checkout, an unverified handoff, or a turn that announces work and stops each counts as a drift signal.
      zh: 再检查行为：用错工具、两个代理同时写一个工作区、没验证就交付、说了要做却结束回合，都算偏离信号。
    - en: Each signal is handled where it occurs, at the tool call, the tool result, the subagent handoff or the end of the turn, with a block or a reminder.
      zh: 每个信号在它出现的位置处理：工具调用、工具结果、子代理交付或回合结束，处理方式是阻断或提醒。
  seen: [tool-policy-nag, isolation-nudge, task-completion-judge, turn-judge]

roles:
  order: 3
  short:
    en: Separate roles
    zh: 角色分离
  summary:
    en: Workers keep no state between jobs. Advisors read your own words, not the main agent's summary of them.
    zh: 执行者在两次任务之间不保留状态；顾问读到的是你的原话，不是主代理的转述。
  title:
    en: One owner per state; planning, execution and advice kept apart
    zh: 权威源头单一，编排、执行、顾问分离
  problem:
    en: A main agent writing a subagent's brief passes its own assumptions down with it. A button or a subagent that acts on its own creates a second version of the same state.
    zh: 主代理给子代理写派工说明时，会把自己的假设一并传下去；按钮或子代理擅自改动状态，同一件事就有了两个版本。
  practice:
    - en: Execution goes to stateless `task:*` tiers. Each receives a brief and returns a result.
      zh: 执行交给无状态的 `task:*` 档位：接一份派工说明，交一份结果。
    - en: Advisors (`discuss:*`, `mentor:default`) receive the user's original request directly and work read-only or with no tools.
      zh: 顾问（`discuss:*`、`mentor:default`）直接拿到用户的原始请求，只读或没有工具。
    - en: In a Playbook, a button sends a request to the coordinator. The button changes nothing by itself.
      zh: 在 Playbook 里，按钮只向协调者发出请求，本身不改变任何状态。
  seen: [worker-tiers, advisors, user-prompt-inject, task-split-check]

policy:
  order: 4
  short:
    en: Mechanism and policy
    zh: 机制与策略
  summary:
    en: Extensions provide the mechanism. The author's choices ship beside it as examples you can replace.
    zh: 扩展提供机制；作者的选择作为可替换的示例一起发布。
  title:
    en: Keep the mechanism separate from the default policy
    zh: 机制与默认策略分离
  problem:
    en: A personal workflow hard-coded into an extension becomes a black box. A rule written only as prose has no force at runtime.
    zh: 个人工作流写死进扩展，就成了黑盒；只写成文字的规则，运行时没有约束力。
  practice:
    - en: Each extension offers a mechanism with scope conditions, such as session, model or mode.
      zh: 每个扩展提供一种带作用域条件的机制，条件可以是会话、模型或模式。
    - en: The replacement rules, prompt fragments, turn checks and subagent definitions in the repository are runnable examples of one author's policy.
      zh: 仓库随附的替换规则、提示词片段、回合判定和子代理定义，都是作者默认策略的可运行示例。
    - en: The updater merges three ways and keeps your local changes. Every plugin also works without omp-config.
      zh: 更新器做三方合并，保留你的本地改动；每个插件不装 omp-config 也能用。
  seen: [omp-modes, turn-judge, watchdog-agent, model-compaction]
