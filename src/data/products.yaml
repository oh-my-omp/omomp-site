playbooks:
  order: 1
  name: omp-playbooks
  repo: https://github.com/oh-my-omp/omp-playbooks
  tagline:
    en: Write the design together with the agent, then launch it block by block.
    zh: 和代理一起写设计，再一块一块启动执行。
  claim:
    en: The design document is also the run
    zh: 设计文档本身就是执行记录
  intro:
    en: One YAML file holds the design, the prompts that execute it and the code that orchestrates them. You edit it as cards in a Tern pane; the agent edits the same file through its tools.
    zh: 一个 YAML 文件同时装下设计、执行提示词和编排代码。你在 Tern 面板里按卡片编辑，代理通过工具读写同一个文件。
  sections:
    - title:
        en: Design and execution are separate blocks
        zh: 设计块与执行块分离
      points:
        - en: A design block holds one unit of design, written as a requirement and its rendered result.
          zh: 每个设计块只装一个设计单元：一条需求，以及按它渲染出的结果。
        - en: An execution block pulls in the designs, context and earlier results it needs by reference. One task can draw on several designs.
          zh: 执行块按引用拉取所需的设计、上下文和先前结果；一个任务可以引用多个设计块。
        - en: Compiling a block freezes its prompt, so what a subagent received is always on record.
          zh: 编译时提示词被冻结下来，子代理收到了什么，始终有据可查。
    - title:
        en: The button asks, the coordinator decides
        zh: 按钮只是请求，协调者做决定
      points:
        - en: Launch, Stop and a design change are requests to the main session. Clicking never runs anything on its own.
          zh: 启动、停止和修改设计，都是发给主会话的请求；点击本身不会让任何东西运行。
        - en: The coordinator compiles the prompt, picks the subagent and decides the order.
          zh: 编译提示词、挑选子代理、决定先后顺序，都由协调者负责。
        - en: Change a design while it runs, and the coordinator is told which blocks it touched.
          zh: 运行中改了设计，协调者会收到通知，知道哪些块受影响。
    - title:
        en: Status lives in the file
        zh: 状态写在文件里
      points:
        - en: Each subagent writes its block's status and a report back into the Playbook.
          zh: 每个子代理把自己那块的状态和报告写回 Playbook。
        - en: A run copies the Playbook with fresh state, so the template stays clean for the next time.
          zh: 每次运行都复制一份带全新状态的 Playbook，模板留着下次用。
        - en: Another coordinator can pick the document up where the last one stopped.
          zh: 换一个协调者，也能从上一个停下的地方接着做。
  parties:
    - name:
        en: You
        zh: 你
      role:
        en: Edit blocks, read designs, ask for launches and changes.
        zh: 编辑卡片、审阅设计，提出启动和修改请求。
    - name:
        en: Coordinator
        zh: 协调者
      role:
        en: The omp main session. Revises designs, compiles prompts, runs subagents.
        zh: omp 主会话：修订设计、编译提示词、运行子代理。
    - name:
        en: Document service
        zh: 文档服务
      role:
        en: Stores the file, resolves references, draws the pane, notifies the coordinator.
        zh: 存储文件、解析引用、绘制面板、通知协调者。
    - name:
        en: Subagent
        zh: 子代理
      role:
        en: Runs one compiled prompt and writes status and report back.
        zh: 执行一份编译好的提示词，把状态和报告写回文件。

dispatch:
  order: 2
  name: omp-dispatch
  repo: https://github.com/oh-my-omp/omp-dispatch
  tagline:
    en: Deliver a GitHub issue tree. A fresh session per ticket, a fresh judge per verdict.
    zh: 交付一整棵 GitHub issue 树。每张工单由新会话完成，每次裁决由新会话做出。
  claim:
    en: An issue tree goes in. Merged, verified, closed issues come out
    zh: 输入一棵 issue 树，输出已合并、已验证、已关闭的 issue
  intro:
    en: Click the link an issue carries, or let a GitHub App event fire, and a coordinator session opens for that issue. It turns the tree into tickets and walks each one through a workflow you can rewrite.
    zh: 点击 issue 里的链接，或由 GitHub App 事件触发，就会为该 issue 开一个协调者会话。它把整棵树拆成工单，按一份你可以改写的工作流逐单推进。
  sections:
    - title:
        en: Tickets move through a state machine
        zh: 每张工单走一台状态机
      points:
        - en: The default path runs from coding to a PR, checks, review, merge, verification and close.
          zh: 默认路径：编码、开 PR、等检查、评审、合并、验证、关闭。
        - en: The workflow is a YAML file. Add a judge, reroute a rejection, or skip a step for first-round work.
          zh: 工作流是一个 YAML 文件：加一个判定者，改掉退回的去向，或者让首轮跳过某一步。
        - en: The coordinator decides which tickets run side by side and which wait on a dependency.
          zh: 哪些工单并行、哪些等依赖，由协调者决定。
    - title:
        en: Every seat is new
        zh: 每个席位都是新的
      points:
        - en: The work on a ticket is done by a one-shot session in its own checkout. It pushes a branch and submits.
          zh: 每张工单由一次性会话在独立检出里完成，推送分支后提交。
        - en: A judge is always a fresh session, pinned to the exact PR head or merge commit it rules on.
          zh: 判定者永远是新会话，钉在它所裁决的那个 PR head 或合并提交上。
        - en: A new push drops every approval given to the old one.
          zh: 一推新提交，旧提交上的批准全部作废。
    - title:
        en: Nothing counts until GitHub confirms it
        zh: GitHub 确认了才算数
      points:
        - en: Every write to GitHub is recorded first, then confirmed by reading it back.
          zh: 每次写 GitHub 都先记录，再读回来确认。
        - en: The agenda survives a crash. A new coordinator resumes it only when the old one is gone.
          zh: 议程在崩溃后仍然保留；只有确认旧协调者已退出，新协调者才会接手。
        - en: A failed or uncertain write goes to the coordinator, never silently retried.
          zh: 写失败或结果不明，一律交给协调者处理，不会悄悄重试。
  parties:
    - name:
        en: You
        zh: 你
      role:
        en: File the issue tree and click its link.
        zh: 写好 issue 树，点一下链接。
    - name:
        en: Coordinator
        zh: 协调者
      role:
        en: Convenes tickets, sets dependencies, rules on escalations.
        zh: 编排工单、设定依赖、裁决升级上来的问题。
    - name:
        en: Owner
        zh: 负责人
      role:
        en: A one-shot session that delivers one ticket.
        zh: 一次性会话，交付一张工单。
    - name:
        en: Judge
        zh: 判定者
      role:
        en: A fresh session that rules on one exact commit.
        zh: 全新会话，只对一个确定的提交做裁决。

remote-build:
  order: 3
  name: omp-remote-build
  repo: https://github.com/oh-my-omp/omp-remote-build
  tagline:
    en: Edit on your laptop. Build and test in a remote container, one per worktree.
    zh: 在本机编辑，到远端容器里构建和测试，每个 worktree 一个容器。
  claim:
    en: Edit here. Build there
    zh: 这边改，那边构建
  intro:
    en: The agent keeps editing files locally with its usual tools. Compiling, testing and running happen in a container on a remote host that sees every edit before the next step.
    zh: 代理照常用本地工具改文件；编译、测试、运行都在远端主机的容器里进行，每一步之前容器都已看到最新改动。
  sections:
    - title:
        en: One environment per worktree
        zh: 每个 worktree 一套环境
      points:
        - en: Each worktree is mirrored one way to the build host, and a long-lived container mounts the mirror.
          zh: 每个 worktree 单向同步到构建主机，由长驻容器挂载该同步目录。
        - en: After any tool call that could have changed files, the mirror is flushed before the agent moves on.
          zh: 任何可能改了文件的工具调用之后，都先刷新同步，代理才继续下一步。
        - en: A project opts in with one file. Projects without it are never touched.
          zh: 项目只需一个配置文件即可接入；未配置的项目一概不碰。
    - title:
        en: The image is part of the repository
        zh: 镜像写进仓库
      points:
        - en: The toolchain comes from a named image, the worktree's own Dockerfile, or one a subagent prepares and commits.
          zh: 工具链来自指定镜像、worktree 自带的 Dockerfile，或由子代理准备好并提交的 Dockerfile。
        - en: Built images are cached by Dockerfile content, so worktrees with the same file share one.
          zh: 构建好的镜像按 Dockerfile 内容缓存，同一份文件的 worktree 共用一个镜像。
    - title:
        en: The agent gets a terminal inside
        zh: 代理在容器里有自己的终端
      points:
        - en: Container tools open interactive terminal sessions in the remote container.
          zh: 容器工具在远端容器里打开交互式终端会话。
        - en: The tools are on from the start of a session, so switching worktrees never changes the prompt prefix.
          zh: 这些工具在会话一开始就启用，换 worktree 也不会改动提示词前缀。
  parties:
    - name:
        en: Your machine
        zh: 本机
      role:
        en: The omp session and the git worktree you edit.
        zh: omp 会话和你编辑的 git worktree。
    - name:
        en: Mutagen
        zh: Mutagen
      role:
        en: Mirrors the worktree one way to the build host.
        zh: 把 worktree 单向同步到构建主机。
    - name:
        en: Komodo
        zh: Komodo
      role:
        en: Deploys and runs the container on the build host.
        zh: 在构建主机上部署并运行容器。
    - name:
        en: Container
        zh: 容器
      role:
        en: Builds, tests and runs, with the mirror as its working directory.
        zh: 以同步过来的目录为工作目录，构建、测试、运行。
