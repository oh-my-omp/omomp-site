playbooks:
  order: 1
  name: omp-playbooks
  repo: https://github.com/oh-my-omp/omp-playbooks
  headline:
    en: Design with the agent, launch by block
    zh: 共写设计，再按块启动
  tagline:
    en: Write the design together with the agent, then launch it block by block.
    zh: 和代理一起写设计，再一块一块启动执行。
  intro:
    en: One YAML file holds the design, the prompts that execute it and the code that orchestrates them. You edit it as cards in a Tern pane; the agent edits the same file through its tools.
    zh: 一个 YAML 文件同时装下设计、执行提示词和编排代码。你在 Tern 面板里按卡片编辑，代理通过工具读写同一个文件。
  sections:
    - title:
        en: Blocks reference designs
        zh: 执行块引用设计块
      points:
        - en: Blocks cite a design as `((b1))`; compiling freezes the exact prompt.
          zh: 执行块用 `((b1))` 引用设计块，编译时冻结发给子代理的提示词。
    - title:
        en: Clicks reach the coordinator
        zh: 点击送到协调者
      points:
        - en: A click arrives as a notice; the coordinator starts the subagent in eval.
          zh: 点击以通知送达协调者，由它在 eval 里启动子代理。
    - title:
        en: Status lives in the file
        zh: 状态写回文件
      points:
        - en: Subagents write status and reports into the YAML; each run is its own copy.
          zh: 子代理把状态与报告写回 YAML；每次运行另存一份副本。
  roles:
    hub:
      name:
        en: Coordinator
        zh: 协调者
      role:
        en: The omp main session. Revises designs, compiles prompts, runs subagents.
        zh: omp 主会话：修订设计、编译提示词、运行子代理。
    around:
      - name:
          en: You
          zh: 你
        role:
          en: Edit blocks, read designs, ask for launches and changes.
          zh: 编辑卡片、审阅设计，提出启动和修改请求。
        edge:
          en: launch / edit request
          zh: 启动 / 改设计请求
        dir: in
      - name:
          en: Document service
          zh: 文档服务
        role:
          en: Stores the file, resolves references, draws the pane, notifies the coordinator.
          zh: 存储文件、解析引用、绘制面板、通知协调者。
        edge:
          en: file + notices
          zh: 文件与通知
        dir: both
      - name:
          en: Subagent
          zh: 子代理
        role:
          en: Runs one compiled prompt and writes status and report back.
          zh: 执行一份编译好的提示词，把状态和报告写回文件。
        edge:
          en: compiled prompt · status + report
          zh: 编译提示词 · 状态与报告
        dir: both
dispatch:
  order: 2
  name: omp-dispatch
  repo: https://github.com/oh-my-omp/omp-dispatch
  headline:
    en: Fresh sessions deliver your issue tree
    zh: 整棵工单树，由新会话交付
  tagline:
    en: "Hand over a GitHub issue tree: each ticket is delivered by a new session, and every verdict comes from a new judge."
    zh: 交出一棵 GitHub issue 树：每张工单由新会话交付，每次裁决都由新的判定者做出。
  intro:
    en: Click the link an issue carries, or let a GitHub App event fire, and a coordinator session opens for that issue. It turns the tree into tickets and walks each one through a workflow you can rewrite.
    zh: 点击 issue 里的链接，或由 GitHub App 事件触发，就会为该 issue 开一个协调者会话。它把整棵树拆成工单，按一份你可以改写的工作流逐单推进。
  sections:
    - title:
        en: Tickets follow a workflow
        zh: 工单按工作流推进
      points:
        - en: A YAML workflow walks each ticket from PR through checks, review and merge.
          zh: YAML 工作流带每张工单走完开 PR、检查、评审与合并。
    - title:
        en: Every judge is a new session
        zh: 每个判定者都是新会话
      points:
        - en: A judge rules on one exact commit; a new push voids earlier approvals.
          zh: 判定者只裁决一个确定的提交；新的推送让旧批准作废。
    - title:
        en: GitHub confirms every write
        zh: 写入以 GitHub 回读为准
      points:
        - en: Each write is logged first and counts only after GitHub reads it back.
          zh: 每次写入先落盘记录，GitHub 回读确认后才算数。
  roles:
    hub:
      name:
        en: Coordinator
        zh: 协调者
      role:
        en: Convenes tickets, sets dependencies, rules on escalations.
        zh: 编排工单、设定依赖、裁决升级上来的问题。
    around:
      - name:
          en: You
          zh: 你
        role:
          en: File the issue tree and click its link.
          zh: 写好 issue 树，点一下链接。
        edge:
          en: issue tree + link
          zh: 工单树与启动链接
        dir: in
      - name:
          en: Owner
          zh: 负责人
        role:
          en: A one-shot session that delivers one ticket.
          zh: 一次性会话，交付一张工单。
        edge:
          en: ticket brief · branch + submit
          zh: 工单简报 · 分支与提交
        dir: both
      - name:
          en: Judge
          zh: 判定者
        role:
          en: A fresh session that rules on one exact commit.
          zh: 全新会话，只对一个确定的提交做裁决。
        edge:
          en: seat brief · verdict
          zh: 席位简报 · 裁决
        dir: both
remote-build:
  order: 3
  name: omp-remote-build
  repo: https://github.com/oh-my-omp/omp-remote-build
  headline:
    en: Edit locally, build remotely
    zh: 本机改代码，远程跑构建
  tagline:
    en: The agent edits files on your machine while builds and tests run in a remote container, one per worktree.
    zh: 代理在本机改文件，构建和测试在远程容器里跑，每个 worktree 一个容器。
  intro:
    en: The agent keeps editing files locally with its usual tools. Compiling, testing and running happen in a container on a remote host that sees every edit before the next step.
    zh: 代理照常用本地工具改文件；编译、测试、运行都在远端主机的容器里进行，每一步之前容器都已看到最新改动。
  sections:
    - title:
        en: One environment per worktree
        zh: 每个 worktree 一套环境
      points:
        - en: Each worktree syncs one way to its own container, flushed after every write.
          zh: 每个 worktree 单向同步到自己的容器，每次写入后自动刷新。
    - title:
        en: The image comes from the repo
        zh: 镜像随仓库定义
      points:
        - en: Images build from the worktree's Dockerfile, cached by its content hash.
          zh: 镜像由 worktree 里的 Dockerfile 构建，按内容哈希缓存。
    - title:
        en: The agent gets a shell inside
        zh: 代理在容器里有终端
      points:
        - en: Container tools open persistent shells inside the remote container.
          zh: 容器工具在远程容器里开长驻终端，会话启动时即已注册。
  roles:
    hub:
      name:
        en: Your machine
        zh: 本机
      role:
        en: The omp session and the git worktree you edit.
        zh: omp 会话和你编辑的 git worktree。
    around:
      - name:
          en: Mutagen
          zh: Mutagen
        role:
          en: Mirrors the worktree one way to the build host.
          zh: 把 worktree 单向同步到构建主机。
        edge:
          en: one-way replica
          zh: 单向副本
        dir: out
      - name:
          en: Komodo
          zh: Komodo
        role:
          en: Deploys and runs the container on the build host.
          zh: 在构建主机上部署并运行容器。
        edge:
          en: deployment
          zh: 部署
        dir: out
      - name:
          en: Container
          zh: 容器
        role:
          en: Builds, tests and runs, with the mirror as its working directory.
          zh: 以同步过来的目录为工作目录，构建、测试、运行。
        edge:
          en: container_exec
          zh: 容器执行
        dir: both
