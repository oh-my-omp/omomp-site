intent:
  order: 1
  replay: ["1"]
  short: { en: Intent, zh: 意图 }
  name:
    en: Intent enters the session
    zh: 意图进入会话
  claim:
    en: A question worth asking is worth a full screen
    zh: 值得问的问题，值得占满一屏
  drift:
    en: The agent guesses instead of asking, or asks in a line you skim past and answer wrong.
    zh: 代理该问不问，自己猜；或者问得含糊，夹在一行字里，你扫一眼就答错了。
  sections:
    human:
      en: Nothing important is settled in a chat line you scroll past. Decisions get their own screen, and your own draft can be polished before it goes out.
      zh: 重要的事不在一滚而过的聊天里定下。决定有自己的一屏，你的草稿也能先润色再发出。
    agent:
      en: Asking is a tool with a fixed shape. The agent cannot leave out the context or the cost.
      zh: 提问是一个有固定格式的工具，代理省不掉背景，也省不掉代价。
    silent:
      en: Before a question opens, a judge that has never seen the session reads it. Questions meant for you cannot take a route around that check.
      zh: 问题打开之前，先由没看过这个会话的判定者读一遍；给你的问题绕不开这道检查。

prompt:
  order: 2
  short: { en: Prompt, zh: 提示词 }
  name:
    en: Prompts load and stay put
    zh: 提示词加载与防漂移
  claim:
    en: Instructions that never contradict each other, delivered without breaking the cache
    zh: 指令互不矛盾，送达不破缓存
  drift:
    en: The base template, tool descriptions and your rules say the same thing three ways, or opposite things. The model starts ignoring all of them.
    zh: 基础模板、工具说明和你的规则把同一件事说三遍，或者说法相反，模型干脆都不听。
  sections:
    human:
      en: You choose how much governance a session carries when you launch it.
      zh: 启动时，你就决定这个会话带多少治理。
    agent:
      en: The prompt carries a table of contents, not the manual.
      zh: 提示词里只放目录，不放整本手册。
    silent:
      en: The prompt says each thing once. Conflicts are overridden by added messages, and instructions reach only the model, mode and files they are for.
      zh: 提示词每件事只说一遍；冲突用追加消息覆盖；指令只送给对应的模型、模式和文件。

memory:
  order: 3
  short: { en: Memory, zh: 记忆 }
  name:
    en: Long tasks keep their plan
    zh: 长任务规划与记忆
  claim:
    en: The plan outlives the context window
    zh: 计划比上下文窗口活得久
  drift:
    en: Halfway through, the agent forgets a constraint you settled an hour ago, or stops with items still open.
    zh: 做到一半，代理忘了一小时前定下的约束，或者还有事项没做完就停了。
  sections:
    human:
      en: The plan is a document you share with the agent, not a thought inside it.
      zh: 计划是你和代理共用的一份文档，不是藏在它脑子里的念头。
    agent:
      en: The agent keeps a structured plan, can look back over earlier contexts, and can hand a subagent the whole conversation.
      zh: 代理守着一份结构化计划，能回看先前的上下文，也能把整段对话交给子代理。
    silent:
      en: Two things that quietly erode a long task are watched for, stopping early and compacting too soon.
      zh: 长任务最容易悄悄流失的两样东西被盯住：提前收工，以及过早压缩。

delegation:
  order: 4
  replay: ["2", "3"]
  short: { en: Delegation, zh: 派发 }
  name:
    en: Work goes to subagents and advisors
    zh: 子代理派发与顾问
  claim:
    en: Workers get a brief. Advisors get your words
    zh: 执行者拿到派工单，顾问拿到你的原话
  drift:
    en: The main agent's brief carries its own misreading to every subagent, and two of them edit the same checkout at once.
    zh: 主代理的派工单把它自己的误读带给每个子代理，还有两个子代理同时改同一个工作区。
  sections:
    human:
      en: You decide whether the machine may measure its own subagent spend.
      zh: 本机能不能统计自己的子代理花费，由你决定。
    agent:
      en: Doing and advising are separate roles with separate limits.
      zh: 干活和出主意是两种角色，权限各不相同。
    silent:
      en: "Every dispatch is read before it leaves: what it bundles, and whether two writers would collide. Advisors are handed your own words."
      zh: 每次派发在发出前都被读一遍：捆了哪些主题，写者会不会撞车。顾问拿到的是你的原话。

execution:
  order: 5
  replay: ["4", "5"]
  short: { en: Execution, zh: 执行 }
  name:
    en: Commands run under watch
    zh: 命令执行与过程监督
  claim:
    en: The agent's terminal is your terminal too
    zh: 代理的终端，也是你的终端
  drift:
    en: A long command blocks the turn, a shell one-liner deletes the wrong directory, and nobody sees the agent drift back to old habits.
    zh: 长命令卡住整个回合，一行 shell 删错了目录，代理悄悄退回老习惯也没人发现。
  sections:
    human:
      en: What runs on your machine stays in view, and you decide which sessions get a second look.
      zh: 在你机器上跑的东西始终看得见；哪些会话要再审一遍，由你决定。
    agent:
      en: Dedicated tools replace shell one-liners for the jobs that go wrong most often.
      zh: 最容易出事的几类活，用专用工具代替一行 shell。
    silent:
      en: Shell and eval calls are checked before and after they run, and a reviewer you define can look in on a session at intervals.
      zh: shell 和 eval 调用在执行前后都要过检查；你定义的审查者还能定期查看会话。

delivery:
  order: 6
  replay: ["6"]
  short: { en: Delivery, zh: 交付 }
  name:
    en: Results get checked and shared
    zh: 交付验收与跨会话协作
  claim:
    en: Done means checked, not announced. Other sessions can read what happened
    zh: 做完是验过，不是说过；别的会话也查得到经过
  drift:
    en: A subagent reports success without running anything. The main agent writes "next, run the tests" and stops.
    zh: 子代理什么都没跑就报告成功；主代理写下“接下来跑测试”，然后就停了。
  sections:
    human:
      en: What you read on screen is in your language. What the model reads is left as it was.
      zh: 你在屏幕上读到的是你的语言；模型读到的内容保持原样。
    agent:
      en: Work does not end at the edge of one session.
      zh: 工作不止于一个会话的边界。
    silent:
      en: “Done” is checked at the subagent's handoff, at the end of the main turn, and in the language of the reply.
      zh: “做完了”要过三道检查：子代理交付时、主回合结束时，以及回复用的语言。
