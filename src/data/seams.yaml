intent:
  order: 1
  short: { en: Intent, zh: 意图 }
  name:
    en: Intent enters the session
    zh: 意图进入会话
  claim:
    en: Decisions reach you as a page of their own, written so someone new to the project could answer
    zh: 整页提问，新人能答
  drift:
    en: Left to itself, an agent either guesses or buries the question in a single line you skim past.
    zh: 没有这道接缝时，代理要么自己乱猜，要么把问题夹在一行字里让你漏看。
  sections:
    human:
      en: Full-page questions with a tradeoff per option
      zh: 列明背景与取舍
    agent:
      en: Questions state where things stand and a cost per option
      zh: 提问写清现状与代价
    silent:
      en: A judge outside the session rejects unexplained names
      zh: 提问先过判定

prompt:
  order: 2
  short: { en: Prompt, zh: 提示词 }
  name:
    en: Prompts load and stay put
    zh: 提示词加载与防漂移
  claim:
    en: Each instruction appears once, and later changes arrive as appended messages
    zh: 只加载一次，改动随后追加
  drift:
    en: When the base template, tool descriptions and rules repeat or contradict each other, the model stops following any of them.
    zh: 当基础模板、工具说明和规则反复叮嘱同一件事甚至互相矛盾时，模型干脆谁都不听。
  sections:
    human:
      en: You choose how much governance a session carries
      zh: 启动时选治理强度
    agent:
      en: Tool manuals arrive a topic at a time
      zh: 工具说明按需送达
    silent:
      en: Corrections are appended, never spliced into the prefix
      zh: 只追加，不改前缀

memory:
  order: 3
  short: { en: Memory, zh: 记忆 }
  name:
    en: Long tasks keep their plan
    zh: 长任务规划与记忆
  claim:
    en: The plan lives in a list you can both see, and it outlasts the context window
    zh: 计划存清单，压缩后不丢
  drift:
    en: Without a shared list, the agent drops constraints settled an hour ago or stops with tasks still open.
    zh: 没有共同维护的清单，代理做到一半就会忘掉一小时前定下的约束，或者留着未完事项直接停下。
  sections:
    human:
      en: The plan is a panel you and the agent both edit
      zh: 待办面板就是计划
    agent:
      en: The agent keeps a plan that survives compaction
      zh: 计划跨上下文保留
    silent:
      en: An unfinished turn gets a reminder listing what is open
      zh: 未完成会收到提醒

delegation:
  order: 4
  short: { en: Delegation, zh: 派发 }
  name:
    en: Work goes to subagents and advisors
    zh: 子代理派发与顾问
  claim:
    en: Each worker gets its own checkout and one topic; advisors read your own words
    zh: 执行者隔离，顾问读原话
  drift:
    en: Without dispatch checks, the main agent passes its own misreading to subagents and lets multiple writers edit one checkout.
    zh: 没有派发检查时，主代理会把自己的误读传给每个子代理，还会让多个子代理同时改同一个工作区。
  sections:
    human:
      en: You decide whether the machine measures subagent spend
      zh: 本机统计由你决定
    agent:
      en: Work is dispatched to stateless cost tiers
      zh: 子代理按成本分级
    silent:
      en: Every dispatch is checked before it leaves
      zh: 派发前查主题与隔离

execution:
  order: 5
  short: { en: Execution, zh: 执行 }
  name:
    en: Commands run under watch
    zh: 命令执行与过程监督
  claim:
    en: Long commands run in terminals you can watch, and risky shell habits are stopped before they run
    zh: 长命令看得见，危险命令先拦下
  drift:
    en: Left unchecked, a long command blocks the turn, a shell one-liner deletes the wrong directory, and old shell habits return unnoticed.
    zh: 没有过程监督时，长命令会卡死整个回合，一行 shell 就能删错目录，代理退回老习惯也没人察觉。
  sections:
    human:
      en: What runs on your machine stays on screen
      zh: 终端画面看得见
    agent:
      en: Dedicated tools replace the riskiest shell one-liners
      zh: 常用任务用专用工具
    silent:
      en: Shell and eval calls are checked before and after they run
      zh: 调用前后都过检查

delivery:
  order: 6
  short: { en: Delivery, zh: 交付 }
  name:
    en: Results get checked and shared
    zh: 交付验收与跨会话协作
  claim:
    en: A task counts as done once it has been checked, and other sessions can look up how it went
    zh: 验收通过，会话可查
  drift:
    en: Without completion checks, a subagent claims success without running tests, or the main agent writes "next, run the tests" and stops.
    zh: 没有交付检查时，子代理什么都没跑就报成功，主代理写下一句“接下来跑测试”就停工了。
  sections:
    human:
      en: Interface text is in your language
      zh: 界面用你的语言
    agent:
      en: Past sessions are searchable, and peers answer side questions
      zh: 跨会话可问可查
    silent:
      en: Claims of done are checked at handoff and turn end
      zh: 交付与收尾都要检查
