# One entry per component placement on the lifeline. Keys are stable ids.
ask-more-panel:
  name: omp-ask-more
  repo: https://github.com/oh-my-omp/omp-ask-more
  layer: human
  seam: intent
  line:
    en: When the agent needs a decision, the question opens as a full-screen page with the context, the stakes and a tradeoff per option, in the terminal or as a Tern sheet.
    zh: 代理需要做决定时，问题开成一整屏页面，写明背景、利害和每个选项的取舍，显示在终端里或 Tern 浮层中。
  defaults:
    mechanism:
      en: The structured question, the full-screen page, the readability check and the routing rule.
      zh: 结构化提问、全屏页面、可读性检查和路由规则。
    policy:
      en: "Timeout, notification and expiry handling, and the readability check. Shipped: a terminal notification when a question waits too long, the model decides if it still goes unanswered, and the readability check is on."
      zh: 超时、通知与到期处理，以及可读性检查。默认配置：问题等太久时发终端通知，仍无人回答则交给模型决定，可读性检查开启。
    customize: https://github.com/oh-my-omp/omp-ask-more#readme

input-polish:
  name: input-polish
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#input-polish
  layer: human
  seam: intent
  line:
    en: Press the shortcut on a draft and a helper model rewrites it into an overlay you accept or discard before the agent ever sees it.
    zh: 草稿写好时按下快捷键，辅助模型改写出的一版放进浮层，你决定采用还是丢弃，然后才轮到代理看到。
  defaults:
    mechanism:
      en: Shortcut, helper rewrite, accept-or-discard overlay.
      zh: 快捷键、辅助改写、采用或丢弃的浮层。
    policy:
      en: The key and the rewrite instruction. The shipped instruction makes the draft read with more conviction.
      zh: 快捷键和改写指令。默认指令让草稿读起来更有说服力。
    customize: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#input-polish

ask-tool:
  name: ask
  repo: https://github.com/oh-my-omp/omp-ask-more
  layer: agent
  seam: intent
  line:
    en: Every question the agent asks must carry where things stand, what is being decided and the cost of each option, and it can attach code lines, diagrams and short demos, so no vague question reaches you.
    zh: 代理每次提问都要写清现状、要决定什么和每个选项的代价，还能附上代码行、示意图和短演示，含糊的问题到不了你手上。

ask-readability:
  name: omp-ask-more · readability
  repo: https://github.com/oh-my-omp/omp-ask-more#readme
  layer: silent
  seam: intent
  line:
    en: Before a question reaches you it is read as a newcomer with no view of the project or the session would read it, and any sentence leaning on unexplained names, numbers or shorthand is sent back.
    zh: 问题送到你面前之前，先按不看项目、不看会话的新人视角读一遍；凡依赖没解释的名称、编号或缩写的句子都退回重写。

omp-modes:
  name: omp · omp-light
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/plugins-and-modes.md#full-mode-omp-vs-light-mode-omp-light
  layer: human
  seam: prompt
  line:
    en: "At launch you pick between two entry points: full mode loads every check, light mode starts the same agent without the governance hooks, so a short question does not pay for a long task's machinery."
    zh: 启动时在两个入口里选：完整模式加载全部检查，轻量模式启动同一个代理但不带治理钩子，简短问题不必承担长任务的开销。
  defaults:
    mechanism:
      en: A per-launch config overlay; files on disk stay untouched.
      zh: 按启动叠加的配置，不改磁盘上的文件。
    policy:
      en: "Which extensions light mode turns off. Shipped: the dispatch, handoff, advisor and reminder hooks, `fork_task`, and bash interception."
      zh: 轻量模式关掉哪些扩展。默认配置：关掉派发、交付、顾问和提醒类钩子，以及 `fork_task` 和 bash 拦截。
    customize: https://github.com/oh-my-omp/omp-config/blob/main/docs/plugins-and-modes.md#full-mode-omp-vs-light-mode-omp-light

tool-topics:
  name: tool-topics
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#tool-topics
  layer: agent
  seam: prompt
  line:
    en: Host tool descriptions ship as the common case plus a list of topics, and the agent reads a topic only before the call that needs it, so prompts stop carrying every tool's full manual.
    zh: 宿主工具说明只随附常用写法和一份专题目录，代理在需要的那次调用前才读对应专题，提示词里不再背着每个工具的完整手册。
  defaults:
    mechanism:
      en: The topic scheme, description replacement and on-demand delivery.
      zh: 专题协议、说明替换和按需送达。
    policy:
      en: "Which host tools are covered and what each topic says. Shipped: omp's own tools only; plugin tools keep their own docs."
      zh: 覆盖哪些宿主工具，每个专题写什么。默认配置：只覆盖 omp 自带的工具，插件工具沿用自己的文档。
    customize: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#tool-topics

system-template:
  name: SYSTEM_TEMPLATE.md
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/prompts-and-context.md#prompt-files
  layer: silent
  seam: prompt
  line:
    en: The base prompt is rendered from a rewritten template that drops tool prose documented elsewhere and adjusts itself for subagents, so each instruction is said once.
    zh: 基础提示词由重写过的模板渲染，去掉别处已有的工具说明并按子代理身份调整，每条指令只说一遍。

system-prompt-replace:
  name: system-prompt-replace
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/prompts-and-context.md#system-prompt-replace
  layer: silent
  seam: prompt
  line:
    en: When a passage in the rendered prompt contradicts your setup, a declared rule matches it and appends a message quoting the original and stating how it should read, corrected without editing the prompt.
    zh: 渲染后的提示词里有与你配置矛盾的句子时，声明的规则匹配到它，追加一条消息引用原句并写明应当怎么读，提示词本身不动。
  defaults:
    mechanism:
      en: Conditional matching by session, model or mode, declared as an added message.
      zh: 按会话、模型或模式条件匹配，以追加消息声明替换。
    policy:
      en: The shipped rules remove a sentence that conflicts with subagent todos and forbid file lookup inside eval.
      zh: 默认规则删掉与子代理待办冲突的句子，并禁止在 eval 里检索文件。
    customize: https://github.com/oh-my-omp/omp-config/blob/main/docs/prompts-and-context.md#system-prompt-replace

append-system-model:
  name: append-system-model
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/prompts-and-context.md#append-system-model
  layer: silent
  seam: prompt
  line:
    en: When a session, model or mode matches a fragment's conditions, that fragment is appended as a message, so instructions meant for one model or mode stay out of every other prompt.
    zh: 会话、模型或模式满足片段的条件时，该片段作为一条消息追加进提示词，只针对某个模型或模式的指令不会进入其他会话。
  defaults:
    mechanism:
      en: Fragments with conditions, added as one message.
      zh: 带条件的片段，合并成一条追加消息。
    policy:
      en: In full mode the main session consults two discussion advisors on big decisions and a mentor around long investigations.
      zh: 完整模式下，主会话在重大决定时咨询两位讨论顾问，长调查前后咨询导师。
    customize: https://github.com/oh-my-omp/omp-config/blob/main/docs/prompts-and-context.md#append-system-model

repo-rules:
  name: repo-rules
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/prompts-and-context.md#repo-rules
  layer: silent
  seam: prompt
  line:
    en: Project instructions and rule files arrive as added messages named by their path inside the repository, and path-scoped rules wait until a matching file is touched, so moving worktrees never changes the prompt.
    zh: 项目说明和规则文件以仓库内路径命名、作为追加消息送达，按路径生效的规则等碰到匹配文件才来，换工作树不会改动提示词。

todo-panel:
  name: omp-todo-more
  repo: https://github.com/oh-my-omp/omp-todo-more
  layer: human
  seam: memory
  line:
    en: While the agent works a plan, a Tern panel shows the goal, phases and time spent per item, and editing the panel edits the plan the agent is following.
    zh: 代理执行计划时，Tern 面板显示目标、阶段和每项用时；在面板里改，改的就是代理正在执行的那份计划。
  defaults:
    mechanism:
      en: The plan document, time budgets, reminders and commit-on-done.
      zh: 计划文档、时间预算、提醒、完成即提交。
    policy:
      en: "Whether stop reminders fire, how often, and whether a plan is requested up front. Shipped: reminders on, capped per stop, no plan required at the first prompt."
      zh: 是否发出停止提醒、发几次，以及开场是否要求列计划。默认配置：提醒开启、每次停下有上限，开场不强制列计划。
    customize: https://github.com/oh-my-omp/omp-todo-more#readme

todo-tool:
  name: todo · ctx
  repo: https://github.com/oh-my-omp/omp-todo-more
  layer: agent
  seam: memory
  line:
    en: On a long task the agent keeps a plan with a goal, phases and an estimate per item, can commit work as an item closes, and recalls what earlier contexts did through a read-only view.
    zh: 长任务里代理维护一份有目标、分阶段、逐项估时的计划，完成一项可以连带提交改动，还能用只读视图回看先前上下文做过什么。

fork-task:
  name: fork_task
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/prompts-and-context.md#fork-task
  layer: agent
  seam: memory
  line:
    en: When the agent forks a same-model child, the caller's latest request is copied over, so the child starts from the whole conversation and reuses the cached prefix.
    zh: 代理分出同模型的子代理时，调用方最近一次请求被完整复制过去，子代理从整段对话起步并复用已缓存的前缀。

todo-reminders:
  name: omp-todo-more · reminders
  repo: https://github.com/oh-my-omp/omp-todo-more
  layer: silent
  seam: memory
  line:
    en: When a turn ends with items still open, or a long stretch of work never touches the list, a reminder fires and unfinished work cannot close quietly.
    zh: 回合结束时还留着未完成项，或长时间干活却不碰待办列表，都会触发提醒，没做完的事没法悄悄过去。

model-compaction:
  name: model-compaction
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/prompts-and-context.md#model-compaction
  layer: silent
  seam: memory
  line:
    en: You set, per model and per project, when compaction starts for the running session, so settled constraints survive longer before lossy compaction drops them.
    zh: 按模型、按项目设定当前会话何时开始压缩上下文，定下的约束能留得更久，不被有损压缩过早丢掉。
  defaults:
    mechanism:
      en: Rule discovery and a session-only setting.
      zh: 规则发现，以及只作用于当前会话的设置。
    policy:
      en: None shipped. Every rule is yours.
      zh: 默认留空，全部由你决定。
    customize: https://github.com/oh-my-omp/omp-config/blob/main/docs/prompts-and-context.md#model-compaction

subagent-usage-cmd:
  name: /subagent-usage
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#subagent-usage
  layer: human
  seam: delegation
  line:
    en: Running it calibrates from this machine's own session history with no model calls, so the agent can weigh dispatch cost against what your quota has left.
    zh: 运行它只用本机自己的会话历史校准、不调用任何模型，代理因此能把派发成本和剩余额度放在一起权衡。

worker-tiers:
  name: task:*
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/agents.md#subagent-definitions-and-model-bindings
  layer: agent
  seam: delegation
  line:
    en: Dispatched work goes to a stateless tier ranked by cost and trust that takes a brief and returns a structured report, so the cheapest worker that can be trusted gets it.
    zh: 任务派给按成本和可信度排序的无状态执行档位，它接一份派工单、交一份结构化报告，信得过的最低成本执行者拿到任务。
  defaults:
    mechanism:
      en: Stateless tiers, structured handoff, role limits.
      zh: 无状态档位、结构化交付、角色权限。
    policy:
      en: Which model and subscription each tier binds to, chosen so models complement each other and cost is spread.
      zh: 每个档位绑定哪个模型和订阅，按模型互补、成本分摊来选。
    customize: https://github.com/oh-my-omp/omp-config/blob/main/docs/agents.md#subagent-definitions-and-model-bindings

advisors:
  name: discuss:* · mentor:default
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/agents.md#advisor-context-and-user-prompt-inject
  layer: agent
  seam: delegation
  line:
    en: Consulted by the main agent, a conservative and an expansive discussion partner that can only read and a mentor with no tools at all give it a second opinion that is not its own echo.
    zh: 主代理咨询时，一个保守、一个发散且都只能读的讨论伙伴，加上一个完全没有工具的导师，给出不同于自己回声的第二种意见。

subagent-usage-tool:
  name: subagent_usage
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#subagent-usage
  layer: agent
  seam: delegation
  line:
    en: It estimates, per agent, how many more dispatches fit before that model's quota runs out, so the dispatch decision sees the budget.
    zh: 它估算每个代理在其模型额度用完前还能派几次，派发决策因此看得见预算。

user-prompt-inject:
  name: user-prompt-inject
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/agents.md#user-prompt-inject
  layer: silent
  seam: delegation
  line:
    en: Every time an advisor wakes it receives your own messages and answers from the root session, so it judges what you said rather than the main agent's paraphrase.
    zh: 顾问每次被唤醒都会收到根会话里你本人的消息和作答，它对照的是你的原话，不是主代理的转述。
  defaults:
    mechanism:
      en: Collecting the user's words from the root session and rendering them for chosen agents.
      zh: 从根会话收集用户原话，并为选定的代理渲染。
    policy:
      en: Which agents receive them. The shipped template targets the two discussion partners and the mentor.
      zh: 哪些代理收到。默认模板发给两位讨论伙伴和导师。
    customize: https://github.com/oh-my-omp/omp-config/blob/main/docs/agents.md#user-prompt-inject

isolation-nudge:
  name: isolation-nudge
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#isolation-nudge
  layer: silent
  seam: delegation
  line:
    en: A dispatch that would share a checkout between writers is sent back until isolation is stated explicitly, so two writers never end up in one checkout by accident.
    zh: 多个改文件的子代理要共用一个工作区时，派发被退回，直到明确写出是否隔离，两个写作者不会误挤进同一处。

task-split-check:
  name: task-split-check
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#task-split-check
  layer: silent
  seam: delegation
  line:
    en: On every dispatch a judge reads the brief and sends it back if it bundles unrelated topics or caps the report length, keeping one worker to one topic and the report as long as the evidence needs.
    zh: 每次派发都有判定者读派工单，混入无关主题或限制汇报长度的退回，一个执行者只做一个主题，汇报长短由证据决定。
  defaults:
    mechanism:
      en: Two judged checks on every dispatch.
      zh: 每次派发都经过的两项判定。
    policy:
      en: "Which worker definitions opt in to the topic check, and which model judges. Shipped: `task:free`, `task:low` and `task:mid` opt in."
      zh: 哪些子代理档位启用主题检查，由哪个模型判定。默认配置：`task:free`、`task:low`、`task:mid` 启用。
    customize: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#task-split-check

terminals-hud:
  name: omp-unified-exec
  repo: https://github.com/oh-my-omp/omp-unified-exec
  layer: human
  seam: execution
  line:
    en: Every long-lived session gets a Tern pane showing its live screen, and your keystrokes go to the same process the agent drives, so you can watch or step in.
    zh: 每个长驻会话在 Tern 里都有一个显示实时画面的面板，你敲的键送进代理驱动的同一个进程，可以旁观也可以直接上手。

watchdog-cmd:
  name: /watchdog
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#watchdog-agent
  layer: human
  seam: execution
  line:
    en: The command lists, toggles and drafts the watchdog specs on this machine, so you decide which sessions get a periodic second look.
    zh: 这个命令列出、开关、起草本机的看门狗配置，由你决定哪些会话定期被复查。

exec-tools:
  name: exec_command · write_stdin · monitor
  repo: https://github.com/oh-my-omp/omp-unified-exec
  layer: agent
  seam: execution
  line:
    en: Servers, REPLs and TUIs run in PTY sessions that outlive the turn, where the agent sends input, reads the screen and waits for a match, so they never block the turn.
    zh: 服务器、REPL 和 TUI 运行在跨回合存活的 PTY 会话里，代理可以输入、读屏、等待匹配的输出，回合不会被卡住。

delete-tool:
  name: delete
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#delete-guard
  layer: agent
  seam: execution
  line:
    en: A deletion takes literal paths only, checks them all first and moves them to the trash unless you asked for permanent removal, so what it removes is named exactly and can be undone.
    zh: 删除只接受字面路径，先全部校验，默认移进回收站、只有你明确要求才永久删除，删什么写得清楚，也能撤回。

wt:
  name: wt · harness_restart
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#wt-tool
  layer: agent
  seam: execution
  line:
    en: When the agent needs its own worktree or a harness restart, the request queues until the turn is idle, then runs the host's own command and reports back, and the session is never lost.
    zh: 代理要搬进自己的工作树或重启宿主时，请求先排队，等回合空闲再执行宿主自带的命令并回报结果，会话不丢。

delete-guard:
  name: delete-guard
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#delete-guard
  layer: silent
  seam: execution
  line:
    en: Every shell and eval call is read before it runs, and deletions or commands whose names are not written out are refused, so no file disappears before anyone sees it.
    zh: 每次 shell 和 eval 调用执行前先被读一遍，删除操作和名字没写明的命令会被拒绝，文件不会在没人看见时消失。

tool-policy-nag:
  name: tool-policy-nag
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#tool-policy-nag
  layer: silent
  seam: execution
  line:
    en: Interactive and long-running commands sent to the one-shot shell are refused, and other misuse runs with a reminder attached, so a slide back into shell habits is noticed at the step it happens.
    zh: 走一次性 shell 的交互式和长驻命令被拒绝，其他误用照常执行、结果末尾附提醒，代理退回 shell 老习惯当场就被发现。
  defaults:
    mechanism:
      en: A blocking lane before the call, and reminder lanes after it.
      zh: 调用前的阻断通道，调用后的提醒通道。
    policy:
      en: "Which detector runs, how often reminders fire, how they read, and how risky a command chain may be. Shipped: a rule-based detector with no model calls, reminding only after repeated misuse."
      zh: 用哪种检测、提醒频率和措辞，以及命令链能有多冒险。默认配置：基于规则的检测，不调用模型，同类问题反复出现后才提醒。
    customize: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#tool-policy-nag

watchdog-agent:
  name: watchdog-agent
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#watchdog-agent
  layer: silent
  seam: execution
  line:
    en: For a watched session it counts actions and runs a review at a set interval, then injects what it found, giving one kind of session or one model its own reviewer.
    zh: 对被监视的会话，它统计动作数、每隔一段做一次审查，再把发现注入会话，某一类会话或某个模型由此有了专属审查者。
  defaults:
    mechanism:
      en: Spec discovery, action counting, review and injection.
      zh: 配置发现、动作计数、审查与注入。
    policy:
      en: None shipped. A watchdog exists only once you write its spec.
      zh: 默认留空；写下 WATCHDOG 规则，看门狗才启用。
    customize: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#watchdog-agent

thinking-translator:
  name: omp-thinking-translator
  repo: https://github.com/oh-my-omp/omp-thinking-translator
  layer: human
  seam: delivery
  line:
    en: As each thinking line completes it is translated on screen, and the translation never enters the transcript, so you follow the model's reasoning in your own language.
    zh: 每行思考写完就在屏幕上翻译，译文从不进入会话记录，你能用自己的语言跟上模型的推理。
  defaults:
    mechanism:
      en: Per-line translation and rendering, with model fallback.
      zh: 逐行翻译与渲染，带模型回退。
    policy:
      en: Target language and model chain. None shipped; you create them on first run.
      zh: 目标语言和模型链。默认留空，首次运行时由你创建。
    customize: https://github.com/oh-my-omp/omp-thinking-translator#readme

omomp-lang:
  name: omomp-lang
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#omomp-lang
  layer: human
  seam: delivery
  line:
    en: One setting decides the language of every human-facing string while text sent to the model is never translated, so every plugin shows its interface in the same language.
    zh: 一个设置决定所有面向人的文字用什么语言，发给模型的文字从不翻译，所有插件的界面因此用同一种语言。

sessions:
  name: omp-sessions
  repo: https://github.com/oh-my-omp/omp-sessions
  layer: agent
  seam: delivery
  line:
    en: Every session on the machine is readable through a URL scheme and queryable in SQL, turning past work into evidence the agent can cite.
    zh: 本机每个会话都能通过 URL 协议读取、用 SQL 查询，过去的工作成了代理可以引用的证据。

peers:
  name: omp-peers
  repo: https://github.com/oh-my-omp/omp-peers
  layer: agent
  seam: delivery
  line:
    en: It lists live sessions, asks one a side question it answers without touching its transcript, or posts a message into it, so sessions in separate omp processes can work together.
    zh: 它列出在线会话，可以向其中一个旁路提问（作答不写进对方记录）或发消息进去，分属不同 omp 进程的会话因此可以协作。

task-completion-judge:
  name: task-completion-judge
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#task-completion-judge
  layer: silent
  seam: delivery
  line:
    en: On every handoff it reads the assignment, the recent tool calls and the report, and sends back anything unfinished, unverified or holding open todo items, so a subagent cannot declare success it has not shown.
    zh: 每次交付时它对照派工单、最近的工具调用和报告，把没做完、没验证或留着待办的退回，子代理没法宣称未加证明的成功。
  defaults:
    mechanism:
      en: A judged verdict on every handoff, plus a todo check.
      zh: 每次交付的判定，外加待办检查。
    policy:
      en: "Which worker definitions are judged, and which model judges. Shipped: `task:free`, `task:low` and `task:mid` are judged."
      zh: 哪些子代理档位接受交付判定，由哪个模型判定。默认配置：`task:free`、`task:low`、`task:mid` 接受判定。
    customize: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#task-completion-judge

turn-judge:
  name: turn-judge
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#turn-judge
  layer: silent
  seam: delivery
  line:
    en: After a turn ends a judge answers yes-or-no questions about the reply, and a matching rule sends the agent back to work, so promising to run the tests next is not a place to stop.
    zh: 回合结束后判定者就这次回复回答几个是非题，命中规则就让代理回去接着干，“接下来跑测试”不再是停下的地方。
  defaults:
    mechanism:
      en: Session filters, yes-or-no questions, and a prompt to send when a rule holds.
      zh: 会话过滤条件、是/否判定问题，以及规则成立时发出的提示。
    policy:
      en: The shipped rule catches GPT main sessions that list remaining work and stop.
      zh: 默认规则针对 GPT 主会话：列出剩余工作却停下。
    customize: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#turn-judge

lang-nag:
  name: lang-nag
  repo: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#lang-nag
  layer: silent
  seam: delivery
  line:
    en: It checks the last reply's language, and when it is wrong puts a correction in front of your next message, so replies stay in the language you work in.
    zh: 它检查上一条回复的语言，不对就在你下一条消息前加纠正，回复始终用你工作时用的语言。
  defaults:
    mechanism:
      en: A language judgment and a correction on the next turn.
      zh: 语言判定，以及下一轮的纠正。
    policy:
      en: "The target language and the wording of the correction. Shipped: Chinese, with a one-line reminder to answer in it."
      zh: 目标语言和纠正措辞。默认配置：中文，外加一句提醒改用中文作答。
    customize: https://github.com/oh-my-omp/omp-config/blob/main/docs/extensions.md#lang-nag
